# Render Blueprint: one web service. Secrets are marked sync: false, so Render asks for them
# when the Blueprint is created and they never live in this repo.
services:
  - type: web
    name: closebook
    runtime: node
    plan: starter # 0.5 CPU, 512 MB, always on: no cold start for judges (free instances sleep when idle)
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: CLAUDE_CALLS_PER_DAY
        value: "600"
      - key: CLAUDE_CALLS_PER_SESSION
        value: "80"
